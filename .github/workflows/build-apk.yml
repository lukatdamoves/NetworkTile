name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to gofile
        run: |
          ls -la app/build/outputs/apk/debug/
          curl -sf -F "file=@app/build/outputs/apk/debug/app-debug.apk" https://upload.gofile.io/uploadfile
